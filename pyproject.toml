[project]
name = "factur-ia-api-ia"
version = "1.5.0"
description = "Microservice IA d'extraction de factures (OCR + LLM) pour le système Factur-IA"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    # Jeton d'identité Google du callback vers l'API data derrière IAM Cloud Run
    # (core/gcp_identity.py). Même borne que l'API data ET que le hook mypy de
    # .pre-commit-config.yaml : les garder alignées, sinon le hook voit une
    # autre version et juge différemment les `type: ignore` ciblés.
    "google-auth>=2.57.0",
    "loguru>=0.7",
    "pdfplumber>=0.11",
    "easyocr>=1.7",
    # torch et torchvision arrivent par easyocr : on les déclare quand même ici,
    # sinon la redirection vers l'index CPU (`tool.uv.sources`, plus bas) ne
    # s'applique pas — elle ne vaut que pour les dépendances directes.
    "torch>=2.6",
    "torchvision>=0.21",
    "groq>=0.15",
    "pymupdf>=1.28.0",
    # Client de tracking MLflow seul (monitoring de la qualité d'extraction) :
    # le paquet `mlflow` complet embarque le serveur et tire pandas, numpy,
    # scikit-learn et Flask — inutiles pour écrire des métriques.
    "mlflow-skinny>=3.0",
    # Backend de tracking local SQLite : `mlflow-skinny` embarque le store et ses
    # migrations mais ne déclare pas ces deux dépendances, à fournir nous-mêmes.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Pilote MySQL du tracking MLflow en production (Cloud SQL, cf. README) :
    # URI `mysql+pymysql://...`. Même pilote que le client Django.
    "pymysql>=1.2.0",
    "beautifulsoup4>=4.15.0",
    # Observabilité OpenTelemetry (mêmes bornes que l'API data) : traces OTLP et
    # métriques Prometheus, désactivées par défaut. Tout est pur Python, quelques
    # Mo au total — sans effet notable sur le poids de l'image.
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-exporter-prometheus>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
]

# EasyOCR tire torch, dont les roues PyPI embarquent CUDA sur Linux (37 paquets
# nvidia-*, ~4 Go) alors que l'OCR tourne en CPU (EASYOCR_GPU=False). On les
# résout donc depuis l'index CPU officiel de PyTorch : environnement local, CI
# et image Docker divisés par ~4.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "mypy>=1.20",
    "bandit>=1.8",
    "detect-secrets>=1.5",
    "pre-commit>=4.0",
    "python-semantic-release>=9.15",
    # MLflow complet : uniquement pour l'interface de restitution locale
    # (`uv run mlflow ui`). Le service, lui, n'a besoin que de `mlflow-skinny`.
    "mlflow>=3.0",
]
# POC de recherche sémantique sur la FAQ réglementaire (src/recherche/) —
# volontairement hors des dépendances runtime : les images Docker font
# `uv sync --no-dev`, qui n'installe pas les groupes non par défaut, donc rien
# de tout ceci (ni le modèle d'embeddings) n'entre dans l'image de production.
poc = [
    "sentence-transformers>=5.0",
    "streamlit>=1.40",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "python-dotenv>=1.0",
    "reportlab>=4.2",  # génération de PDF factices pour les tests de détection
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I isort, B bugbear, UP pyupgrade, S flake8-bandit
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]                          # asserts autorisés dans les tests
"src/extractions/prompts.py" = ["E501"]       # texte de prompt, non contraint par la longueur

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Security",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
upload_to_repository = false
upload_to_release = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
